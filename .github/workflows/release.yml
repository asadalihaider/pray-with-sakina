# Builds a signed, universal Sakina and attaches it to a GitHub release.
#
# Triggered by pushing a version tag, and nothing else:
#
#   git tag v0.1.0 && git push origin v0.1.0
#
# A tag containing a hyphen (v0.1.0-test) is published as a pre-release, so
# trying the workflow out does not disturb the real download link.
name: Release

on:
  push:
    tags:
      - "v*"

permissions:
  contents: write

jobs:
  release:
    runs-on: macos-latest
    steps:
      - uses: actions/checkout@v5

      - uses: actions/setup-node@v5
        with:
          node-version: 20
          cache: npm

      # A universal binary needs both architectures. Without the Intel slice,
      # anyone on a pre-2020 Mac downloads something that will not open.
      - name: Add Rust targets
        run: rustup target add aarch64-apple-darwin x86_64-apple-darwin

      - name: Install dependencies
        run: npm ci

      # Cheap checks first: a release that fails its own tests should never
      # reach the point of being built, let alone published.
      - name: Type-check
        run: npx tsc --noEmit

      - name: Test
        working-directory: src-tauri
        run: cargo test

      # The signature is not cosmetic. UNUserNotificationCenter refuses an
      # ad-hoc signed app outright, so an unsigned release would ship without
      # reminders. See the README.
      #
      # The certificate is self-signed, which means `security find-identity`
      # does not consider it valid for code signing and neither Tauri nor
      # codesign will find it by name. Its SHA-1 hash works, so that is what
      # gets passed as the identity.
      - name: Import the signing certificate
        env:
          CERTIFICATE: ${{ secrets.MACOS_CERTIFICATE }}
          CERTIFICATE_PASSWORD: ${{ secrets.MACOS_CERTIFICATE_PASSWORD }}
        run: |
          KEYCHAIN="$RUNNER_TEMP/signing.keychain-db"
          KEYCHAIN_PASSWORD="$(openssl rand -base64 24)"
          echo "$CERTIFICATE" | base64 --decode > "$RUNNER_TEMP/certificate.p12"

          security create-keychain -p "$KEYCHAIN_PASSWORD" "$KEYCHAIN"
          security set-keychain-settings -lut 21600 "$KEYCHAIN"
          security unlock-keychain -p "$KEYCHAIN_PASSWORD" "$KEYCHAIN"
          security import "$RUNNER_TEMP/certificate.p12" -k "$KEYCHAIN" \
            -P "$CERTIFICATE_PASSWORD" -T /usr/bin/codesign -T /usr/bin/security
          # Without this, codesign stops to ask permission to use the key,
          # and a runner has nobody to ask.
          security set-key-partition-list -S apple-tool:,apple:,codesign: \
            -s -k "$KEYCHAIN_PASSWORD" "$KEYCHAIN" > /dev/null
          security list-keychain -d user -s "$KEYCHAIN" login.keychain-db
          rm -f "$RUNNER_TEMP/certificate.p12"

          HASH=$(security find-certificate -c "Sakina Signing" -Z "$KEYCHAIN" \
            | awk '/SHA-1 hash/{print $3}' | head -1)
          if [ -z "$HASH" ]; then
            echo "The certificate did not import. Check the MACOS_CERTIFICATE secret." >&2
            exit 1
          fi
          echo "SIGNING_IDENTITY=$HASH" >> "$GITHUB_ENV"
          echo "Imported certificate $HASH"

      - name: Build
        env:
          APPLE_SIGNING_IDENTITY: ${{ env.SIGNING_IDENTITY }}
          # Separate from the Apple certificate and separate in purpose: this
          # one proves an update came from us, so the app will refuse one it
          # cannot verify.
          TAURI_SIGNING_PRIVATE_KEY: ${{ secrets.TAURI_SIGNING_PRIVATE_KEY }}
          TAURI_SIGNING_PRIVATE_KEY_PASSWORD: ${{ secrets.TAURI_SIGNING_PRIVATE_KEY_PASSWORD }}
        run: npm run tauri build -- --target universal-apple-darwin

      # Signing silently falling back to ad-hoc would produce a build that
      # looks fine and has no reminders, so fail loudly instead.
      - name: Verify the signature
        run: |
          APP="src-tauri/target/universal-apple-darwin/release/bundle/macos/Sakina.app"
          codesign --verify --deep --strict --verbose=2 "$APP"
          codesign -dvv "$APP" 2>&1 | grep -E "^Authority|^Identifier|^TeamIdentifier"
          if codesign -dvv "$APP" 2>&1 | grep -q "Signature=adhoc"; then
            echo "Signed ad-hoc. Reminders would not work in this build." >&2
            exit 1
          fi
          BIN=$(plutil -extract CFBundleExecutable raw "$APP/Contents/Info.plist")
          lipo -archs "$APP/Contents/MacOS/$BIN"

      # ditto, not zip: a plain zip loses the symlinks and extended attributes
      # inside an .app bundle and breaks the signature with them.
      - name: Package
        run: |
          APP="src-tauri/target/universal-apple-darwin/release/bundle/macos/Sakina.app"
          ditto -c -k --sequesterRsrc --keepParent "$APP" Sakina.zip
          shasum -a 256 Sakina.zip | tee checksum.txt

      # The in-app updater reads a manifest, not the release page. It wants
      # the tarball Tauri produced and the signature beside it; a download
      # the app cannot verify is one it refuses to install.
      - name: Build the update manifest
        env:
          TAG: ${{ github.ref_name }}
        run: |
          BUNDLE="src-tauri/target/universal-apple-darwin/release/bundle/macos"
          TARBALL="$BUNDLE/Sakina.app.tar.gz"
          if [ ! -f "$TARBALL" ] || [ ! -f "$TARBALL.sig" ]; then
            echo "Tauri did not produce a signed updater bundle." >&2
            ls -la "$BUNDLE" >&2
            exit 1
          fi
          cp "$TARBALL" Sakina.app.tar.gz

          VERSION="${TAG#v}"
          SIGNATURE=$(cat "$TARBALL.sig")
          URL="https://github.com/${{ github.repository }}/releases/download/$TAG/Sakina.app.tar.gz"

          # One universal build serves both architectures, so both platform
          # keys point at the same file.
          cat > latest.json <<MANIFEST
          {
            "version": "$VERSION",
            "pub_date": "$(date -u +%Y-%m-%dT%H:%M:%SZ)",
            "platforms": {
              "darwin-aarch64": { "signature": "$SIGNATURE", "url": "$URL" },
              "darwin-x86_64": { "signature": "$SIGNATURE", "url": "$URL" }
            }
          }
          MANIFEST
          python3 -c "import json;json.load(open('latest.json'));print('manifest parses')"

      - name: Publish the release
        env:
          GH_TOKEN: ${{ github.token }}
          TAG: ${{ github.ref_name }}
        run: |
          SHA=$(cut -d' ' -f1 checksum.txt)
          PRERELEASE=""
          case "$TAG" in *-*) PRERELEASE="--prerelease" ;; esac

          cat > notes.md <<NOTES
          ## Install

          Download \`Sakina.zip\`, unzip it, and drag **Sakina.app** into your
          Applications folder.

          The first time you open it, macOS will say it *"could not verify
          Sakina is free of malware"*. It cannot: verifying means paying Apple
          \$99 a year to notarise the build. The app is signed, just not by
          someone Apple has been paid to vouch for.

          To open it anyway: click **Done**, then go to **System Settings →
          Privacy & Security**, scroll to the bottom, and click **Open Anyway**.
          Once per install.

          Or skip the warning entirely — macOS only flags what arrives through
          a browser:

          \`\`\`bash
          curl -L https://github.com/${{ github.repository }}/releases/download/$TAG/Sakina.zip \\
            | tar -xf - -C /Applications && open /Applications/Sakina.app
          \`\`\`

          Universal: Apple silicon and Intel. Requires macOS 13 or later.

          \`\`\`
          SHA-256  $SHA
          \`\`\`
          NOTES

          gh release create "$TAG" Sakina.zip Sakina.app.tar.gz latest.json \
            --title "Sakina $TAG" \
            --notes-file notes.md \
            $PRERELEASE

      - name: Remove the signing keychain
        if: always()
        run: security delete-keychain "$RUNNER_TEMP/signing.keychain-db" || true
